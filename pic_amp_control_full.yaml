spec: schematic-generator/v0.1

project:
  name: PicAmpControl
  description: Linear Amplifier Protection System - PIC16F18855 based

# All components in the circuit
instances:
  # Power Input & Supply
  J1:
    part: Connector_Generic:Conn_01x02
    value: "DC_12V_INPUT"

  U2:
    part: Regulator_Linear:L7805_TO220
    value: "L7805"
    footprint: "Package_TO_SOT_Through-Hole:TO-220-3_Vertical"

  C_IN1:
    part: Device:C
    value: "100nF"

  C_OUT1:
    part: Device:C
    value: "100nF"

  C_OUT2:
    part: Device:C
    value: "10uF"

  # Main MCU
  U1:
    part: MCU_Microchip_PIC16:PIC16F18855-I/SP
    value: "PIC16F18855-I/SP"
    footprint: "Package_DIP:DIP-28_W7.62mm_Socket"

  C_MCU_DECAP:
    part: Device:C
    value: "100nF"

  R_MCLR:
    part: Device:R
    value: "10k"

  # ADC Input Conditioning - Forward Power (SWR Bridge Pre-Filter)
  # 2 channels: Forward (RA0) and Reflected (RA1)
  R_FWD_PRE_DIV_H:
    part: Device:R
    value: "100k"

  R_FWD_PRE_DIV_L:
    part: Device:R
    value: "10k"

  C_FWD_PRE_LPF:
    part: Device:C
    value: "10nF"

  R_REFL_PRE_DIV_H:
    part: Device:R
    value: "100k"

  R_REFL_PRE_DIV_L:
    part: Device:R
    value: "10k"

  C_REFL_PRE_LPF:
    part: Device:C
    value: "10nF"

  # ADC Input Conditioning - Forward Power (SWR Bridge Post-Filter)
  # 2 channels: Forward (RA2) and Reflected (RA3)
  R_FWD_POST_DIV_H:
    part: Device:R
    value: "100k"

  R_FWD_POST_DIV_L:
    part: Device:R
    value: "10k"

  C_FWD_POST_LPF:
    part: Device:C
    value: "10nF"

  R_REFL_POST_DIV_H:
    part: Device:R
    value: "100k"

  R_REFL_POST_DIV_L:
    part: Device:R
    value: "10k"

  C_REFL_POST_LPF:
    part: Device:C
    value: "10nF"

  # Temperature Sensor (RA5)
  R_TEMP_NTC:
    part: Device:R_Thermistor
    value: "10k_NTC_B3950"

  R_TEMP_PULLUP:
    part: Device:R
    value: "10k"

  C_TEMP_LPF:
    part: Device:C
    value: "10nF"

  # Overcurrent Sensor (RB1)
  R_OCP_DIV_H:
    part: Device:R
    value: "47k"

  R_OCP_DIV_L:
    part: Device:R
    value: "10k"

  C_OCP_LPF:
    part: Device:C
    value: "10nF"

  # Overdrive Detector (RB2)
  R_OD_DIV_H:
    part: Device:R
    value: "100k"

  R_OD_DIV_L:
    part: Device:R
    value: "10k"

  C_OD_LPF:
    part: Device:C
    value: "10nF"

  # Drain Peak Detector (RB3)
  R_DRAIN_DIV_H:
    part: Device:R
    value: "200k"

  R_DRAIN_DIV_L:
    part: Device:R
    value: "10k"

  C_DRAIN_LPF:
    part: Device:C
    value: "10nF"

  # Comparator Section - Overcurrent Protection
  U3:
    part: Amplifier_Operational:LM339
    value: "LM339"
    footprint: "Package_DIP:DIP-14_W7.62mm_Socket"

  R_OCP_COMP_FB:
    part: Device:R
    value: "100k"

  R_OCP_REF:
    part: Device:R
    value: "10k"

  # PWM Output for Fan (RC5)
  R_FAN_GATE:
    part: Device:R
    value: "220R"

  D_FAN_CLAMP:
    part: Device:D_Zener
    value: "5.1V"

  Q_FAN:
    part: Device:Q_NMOS
    value: "2N7000"

  J_FAN_OUT:
    part: Connector_Generic:Conn_01x02
    value: "12V_FAN_OUT"

  # Control Outputs
  # TX (RC0), TX_VCC (RC1), TX_BIAS (RC6), TRIP (RC7)
  R_TX_PULLDOWN:
    part: Device:R
    value: "10k"

  R_TX_VCC_PULLDOWN:
    part: Device:R
    value: "10k"

  R_TX_BIAS_PULLDOWN:
    part: Device:R
    value: "10k"

  R_TRIP_PULLDOWN:
    part: Device:R
    value: "10k"

  # I2C LCD Interface (RC3=SDA, RC4=SCL)
  R_I2C_SDA_PU:
    part: Device:R
    value: "4.7k"

  R_I2C_SCL_PU:
    part: Device:R
    value: "4.7k"

  J_I2C:
    part: Connector_Generic:Conn_01x04
    value: "I2C_LCD"

  # Rotary Encoder (RC2=A, RB0=B, RB6=SWITCH)
  SW_ENCODER:
    part: Device:Rotary_Encoder_EC11
    value: "EC11"

  R_ENCODER_PU_A:
    part: Device:R
    value: "10k"

  R_ENCODER_PU_B:
    part: Device:R
    value: "10k"

  R_ENCODER_PU_SW:
    part: Device:R
    value: "10k"

  # PTT Input (RB4) - separate connector
  R_PTT_PULLDOWN:
    part: Device:R
    value: "10k"

  J_PTT_IN:
    part: Connector_Generic:Conn_01x02
    value: "PTT_INPUT"

  # Power Supply Rails (Ground & Bypass)
  C_BYPASS_1:
    part: Device:C
    value: "100nF"

  C_BYPASS_2:
    part: Device:C
    value: "100nF"

  C_BYPASS_3:
    part: Device:C
    value: "100nF"

# Electrical Connections
connections:
  # 12V Raw Supply Rail
  - net: +12V_RAW
    endpoints: [J1.1, U2.1, C_IN1.1, Q_FAN.D, J_FAN_OUT.1]

  # 5V Regulated Supply Rail
  - net: +5V
    endpoints: [
      U2.3,
      C_OUT1.1, C_OUT2.1,
      U1.20, C_MCU_DECAP.1,
      R_MCLR.1,
      R_TEMP_PULLUP.1,
      U3.8,
      C_BYPASS_1.1, C_BYPASS_2.1, C_BYPASS_3.1,
      R_I2C_SDA_PU.1, R_I2C_SCL_PU.1,
      R_ENCODER_PU_A.1, R_ENCODER_PU_B.1, R_ENCODER_PU_SW.1
    ]

  # Ground Rail (common return)
  - net: GND
    endpoints: [
      J1.2,
      U2.2, C_IN1.2, C_OUT1.2, C_OUT2.2,
      U1.8, U1.19, C_MCU_DECAP.2,
      R_MCLR.2,
      R_FWD_PRE_DIV_L.2, C_FWD_PRE_LPF.2,
      R_REFL_PRE_DIV_L.2, C_REFL_PRE_LPF.2,
      R_FWD_POST_DIV_L.2, C_FWD_POST_LPF.2,
      R_REFL_POST_DIV_L.2, C_REFL_POST_LPF.2,
      R_TEMP_PULLUP.2, C_TEMP_LPF.2,
      R_OCP_DIV_L.2, C_OCP_LPF.2,
      R_OD_DIV_L.2, C_OD_LPF.2,
      R_DRAIN_DIV_L.2, C_DRAIN_LPF.2,
      U3.3, R_OCP_COMP_FB.2, R_OCP_REF.2,
      D_FAN_CLAMP.2, Q_FAN.S,
      J_FAN_OUT.2,
      R_TX_PULLDOWN.2, R_TX_VCC_PULLDOWN.2, R_TX_BIAS_PULLDOWN.2, R_TRIP_PULLDOWN.2,
      R_I2C_SDA_PU.2, R_I2C_SCL_PU.2,
      R_ENCODER_PU_A.2, R_ENCODER_PU_B.2, R_ENCODER_PU_SW.2,
      R_PTT_PULLDOWN.2,
      C_BYPASS_1.2, C_BYPASS_2.2, C_BYPASS_3.2,
      J_I2C.1, J_PTT_IN.2
    ]

  # MCU Reset (MCLR)
  - net: MCLR
    endpoints: [U1.1, R_MCLR.1]

  # ADC Channels - Pre-Filter SWR Bridge
  - net: ADC_FWD_PRE
    kind: analog_input
    endpoints: [U1.2, R_FWD_PRE_DIV_L.1]

  - net: ADC_REFL_PRE
    kind: analog_input
    endpoints: [U1.3, R_REFL_PRE_DIV_L.1]

  # ADC Channels - Post-Filter SWR Bridge
  - net: ADC_FWD_POST
    kind: analog_input
    endpoints: [U1.4, R_FWD_POST_DIV_L.1]

  - net: ADC_REFL_POST
    kind: analog_input
    endpoints: [U1.5, R_REFL_POST_DIV_L.1]

  # ADC Channel - Temperature
  - net: ADC_TEMP
    kind: analog_input
    endpoints: [U1.6, R_TEMP_NTC.2]

  # ADC Channel - Overcurrent
  - net: ADC_OCP
    kind: analog_input
    endpoints: [U1.7, R_OCP_DIV_L.1]

  # ADC Channel - Overdrive
  - net: ADC_OD
    kind: analog_input
    endpoints: [U1.9, R_OD_DIV_L.1]

  # ADC Channel - Drain Voltage
  - net: ADC_DRAIN
    kind: analog_input
    endpoints: [U1.10, R_DRAIN_DIV_L.1]

  # Fan Control Output (RC5 -> PWM driver)
  - net: FAN_CTRL
    kind: digital_output
    endpoints: [U1.25, R_FAN_GATE.1]

  # Fan Gate Drive
  - net: FAN_GATE
    endpoints: [R_FAN_GATE.2, D_FAN_CLAMP.1, Q_FAN.G]

  # Control Output: TX (RC0)
  - net: TX_OUT
    kind: digital_output
    endpoints: [U1.11, R_TX_PULLDOWN.1]

  # Control Output: TX_VCC (RC1)
  - net: TX_VCC_OUT
    kind: digital_output
    endpoints: [U1.12, R_TX_VCC_PULLDOWN.1]

  # Control Output: TX_BIAS (RC6)
  - net: TX_BIAS_OUT
    kind: digital_output
    endpoints: [U1.26, R_TX_BIAS_PULLDOWN.1]

  # Control Output: TRIP (RC7)
  - net: TRIP_OUT
    kind: digital_output
    endpoints: [U1.27, R_TRIP_PULLDOWN.1]

  # I2C Bus (RC3=SDA, RC4=SCL)
  - net: I2C_SDA
    kind: i2c_signal
    endpoints: [U1.13, R_I2C_SDA_PU.1, J_I2C.2]

  - net: I2C_SCL
    kind: i2c_signal
    endpoints: [U1.14, R_I2C_SCL_PU.1, J_I2C.3]

  # Rotary Encoder Inputs
  - net: ENC_A
    kind: digital_input
    endpoints: [U1.15, R_ENCODER_PU_A.1, SW_ENCODER.A]

  - net: ENC_B
    kind: digital_input
    endpoints: [U1.16, R_ENCODER_PU_B.1, SW_ENCODER.B]

  - net: ENC_SW
    kind: digital_input
    endpoints: [U1.28, R_ENCODER_PU_SW.1, SW_ENCODER.SW]

  # PTT Input (RB4)
  - net: PTT_IN
    kind: digital_input
    endpoints: [U1.17, R_PTT_PULLDOWN.1, J_PTT_IN.1]

  # Comparator Overcurrent Output to MCU
  - net: HARD_FAULT
    kind: digital_input
    endpoints: [U1.18, U3.1]

constraints:
  - kind: electrical
    target: [+12V_RAW, GND]
    rule: no_short
    severity: error

  - kind: electrical
    target: [+5V, GND]
    rule: no_short
    severity: error

  - kind: electrical
    target: [ADC_FWD_PRE, ADC_REFL_PRE, ADC_FWD_POST, ADC_REFL_POST, ADC_TEMP, ADC_OCP, ADC_OD, ADC_DRAIN]
    rule: adc_range_0_to_5V
    severity: warning

  - kind: electrical
    target: [FAN_CTRL]
    rule: pwm_output_0_to_5V
    severity: warning

  - kind: electrical
    target: [TX_OUT, TX_VCC_OUT, TX_BIAS_OUT, TRIP_OUT]
    rule: digital_output_0_to_5V
    severity: warning

  - kind: physical
    target: [U1]
    rule: no_wire_crosses_body
    severity: warning

outputs:
  - type: kicad_sch
    path: out/pic_amp_protection_generated.kicad_sch
