name: Release firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      artifact_name:
        description: Firmware artifact name from a successful build workflow
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download selected firmware artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: firmware-build.yml
          workflow_conclusion: success
          path: dist
          name: ${{ inputs.artifact_name }}
          if_no_artifact_found: fail

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/**
          draft: false
          generate_release_notes: true
