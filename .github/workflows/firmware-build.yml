name: PIC firmware build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  version:
    name: Auto version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if needed
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

  build:
    name: Build firmware
    needs: version
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BUILD_TAG: ${{ needs.version.outputs.new_tag }}
      XC8_DIR: C:/Program Files/Microchip/xc8/v4.00/bin
      PACK_REPO_PATH: C:/Users/DEVNVME24/.mchp_packs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify XC8 toolchain is installed on the runner
        shell: pwsh
        run: |
          $xc8 = Join-Path $env:XC8_DIR 'xc8-cc.exe'
          if (-not (Test-Path $xc8)) {
            throw "XC8 compiler not found at $xc8. Install the Microchip XC8 toolchain on the self-hosted runner before running this workflow."
          }
          if (-not (Test-Path $env:PACK_REPO_PATH)) {
            New-Item -ItemType Directory -Force -Path $env:PACK_REPO_PATH | Out-Null
          }
          Write-Host "Using XC8 compiler: $xc8"

      - name: Configure project with CMake
        shell: pwsh
        run: |
          cmake --preset PicAmpControl-release `
            -DMP_CC="C:/Program Files/Microchip/xc8/v4.00/bin/xc8-cc.exe" `
            -DMP_AS="C:/Program Files/Microchip/xc8/v4.00/bin/xc8-cc.exe" `
            -DMP_LD="C:/Program Files/Microchip/xc8/v4.00/bin/xc8-cc.exe" `
            -DMP_AR="C:/Program Files/Microchip/xc8/v4.00/bin/xc8-ar.exe" `
            -DPACK_REPO_PATH="C:/Users/DEVNVME24/.mchp_packs"

      - name: Build firmware
        shell: pwsh
        run: |
          cmake --build --preset PicAmpControl-release

      - name: Package output
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Get-ChildItem -Path @((Join-Path $PWD '_build'), (Join-Path $PWD 'out')) -Recurse -Include *.hex,*.elf,*.map,*.xml -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $dist -Force }
          Get-ChildItem $dist | Format-Table Name,Length

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.BUILD_TAG }}
          path: dist/**

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.version.outputs.new_tag }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: Release ${{ needs.version.outputs.new_tag }}
          files: |
            dist/**
          generate_release_notes: true
          draft: false
          prerelease: false

