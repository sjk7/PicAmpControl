name: Auto release firmware

on:
  workflow_run:
    workflows: ["PIC firmware build"]
    types: [completed]

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute release tag
        id: tag
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"

          # Reuse the existing tag if this commit was already released.
          EXISTING="$(git tag --points-at "$SHA" | grep -E '^v0\.0\.[0-9]+$' | head -1 || true)"
          if [ -n "$EXISTING" ]; then
            echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "skip_tag_push=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST="$(git tag -l 'v0.0.*' | sed 's/^v0\.0\.//' | sort -n | tail -1)"
          NEXT="$(( ${LATEST:-0} + 1 ))"
          echo "tag=v0.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "skip_tag_push=false" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.tag.outputs.skip_tag_push == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}" "${{ github.event.workflow_run.head_sha }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Check for existing release
        id: existing_release
        run: |
          set -euo pipefail
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download firmware artifact
        if: steps.existing_release.outputs.exists == 'false'
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: firmware-${{ github.event.workflow_run.head_sha }}
          path: dist
          if_no_artifact_found: fail

      - name: Create GitHub Release
        if: steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/**
          draft: false
          generate_release_notes: true
